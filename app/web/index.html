<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>控制台 · AI梦境画画师 2API</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="logo">🎨</div>
      <div>AI梦境画画师 2API<div class="sub">管理控制台 · <span id="ver">-</span></div></div>
    </div>
    <div class="row">
      <a href="/docs" class="badge">API 文档</a>
      <button class="ghost small" id="logout">退出登录</button>
    </div>
  </header>

  <div class="tabs">
    <button data-tab="overview" class="active">概览</button>
    <button data-tab="keys">API 密钥</button>
    <button data-tab="settings">设置</button>
    <button data-tab="password">密码</button>
  </div>

  <!-- 概览 -->
  <section id="tab-overview">
    <div class="grid cols" id="stats"></div>
    <div class="card mt">
      <div class="row between">
        <h2>账号池 <span class="hint">自动注册 / 保鲜</span></h2>
        <div class="row">
          <span class="badge" id="pool-badge">-</span>
          <button class="ghost small" id="refill">补充账号</button>
        </div>
      </div>
      <div class="mt" style="overflow-x:auto">
        <table>
          <thead><tr><th>ID</th><th>昵称</th><th>剩余额度</th><th>已用</th><th>状态</th></tr></thead>
          <tbody id="pool-body"><tr><td colspan="5" class="muted">加载中…</td></tr></tbody>
        </table>
      </div>
    </div>
  </section>

  <!-- API 密钥 -->
  <section id="tab-keys" class="hidden">
    <div class="card">
      <div class="row between">
        <h2>API 密钥 <span class="hint">用于 /v1 接口鉴权</span></h2>
        <div class="row">
          <label style="margin:0;display:flex;gap:8px;align-items:center">
            <input type="checkbox" id="require-key" style="width:auto"> 强制鉴权
          </label>
          <button class="small" id="new-key">生成密钥</button>
        </div>
      </div>
      <div class="mt" style="overflow-x:auto">
        <table>
          <thead><tr><th>名称</th><th>密钥</th><th>状态</th><th>操作</th></tr></thead>
          <tbody id="keys-body"><tr><td colspan="4" class="muted">加载中…</td></tr></tbody>
        </table>
      </div>
      <p class="muted mt" style="font-size:12px">提示：密钥仅在创建时完整显示，请及时复制保存。</p>
    </div>
  </section>

  <!-- 设置 -->
  <section id="tab-settings" class="hidden">
    <div class="card">
      <h2>账号池设置</h2>
      <div class="grid cols">
        <div><label>目标账号数</label><input type="number" id="pool.target"></div>
        <div><label>最低账号数</label><input type="number" id="pool.min"></div>
        <div><label>最大账号数</label><input type="number" id="pool.max"></div>
        <div><label>每账号免费额度</label><input type="number" id="pool.free_per_account"></div>
        <div><label>注册最小间隔（秒）</label><input type="number" step="0.5" id="pool.reg_min_interval"></div>
        <div><label>补池间隔（秒）</label><input type="number" step="0.5" id="pool.refill_interval"></div>
        <div><label>会话保鲜 TTL（秒）</label><input type="number" id="pool.session_ttl"></div>
        <div><label>取号超时（秒）</label><input type="number" id="pool.acquire_timeout"></div>
      </div>
    </div>
    <div class="card">
      <h2>上游设置</h2>
      <div class="grid cols">
        <div><label>上游域名</label><input type="text" id="upstream.host"></div>
        <div><label>User-Agent</label><input type="text" id="upstream.user_agent"></div>
        <div><label>请求超时（秒）</label><input type="number" id="upstream.timeout"></div>
        <div><label>轮询间隔（秒）</label><input type="number" step="0.1" id="upstream.poll_interval"></div>
        <div><label>最大轮询次数</label><input type="number" id="upstream.poll_max"></div>
        <div><label>最大重试次数</label><input type="number" id="upstream.max_retries"></div>
      </div>
    </div>
    <div class="card">
      <h2>其他</h2>
      <div class="grid cols">
        <div><label>样式缓存 TTL（秒）</label><input type="number" id="styles_cache_ttl"></div>
        <div><label style="margin-top:26px"><input type="checkbox" id="docs_public" style="width:auto"> 文档公开访问</label></div>
      </div>
      <div class="row mt"><button id="save-settings">保存设置</button></div>
    </div>
  </section>

  <!-- 密码 -->
  <section id="tab-password" class="hidden">
    <div class="card narrow" style="margin:0 auto">
      <h2>修改管理员密码</h2>
      <label>当前密码</label><input type="password" id="pw-current">
      <label>新密码（至少 6 位）</label><input type="password" id="pw-new">
      <label>确认新密码</label><input type="password" id="pw-new2">
      <button class="mt" id="save-pw" style="width:100%">更新密码</button>
      <p class="muted mt" style="font-size:12px">修改后所有登录会话将失效，需要重新登录。</p>
    </div>
  </section>
</div>
<div class="toast" id="toast"></div>
<script src="/assets/app.js"></script>
<script src="/assets/dashboard.js"></script>
</body>
</html>
