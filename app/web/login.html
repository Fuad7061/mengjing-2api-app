<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · mengjing-2api</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<div class="wrap narrow" style="padding-top: 12vh">
  <div class="card">
    <div class="brand" style="margin-bottom: 18px">
      <div class="logo">🎨</div>
      <div>mengjing-2api<div class="sub">Admin Console</div></div>
    </div>
    <label for="pw">Admin password</label>
    <input type="password" id="pw" placeholder="Enter password" autofocus>
    <div id="msg" class="muted mt" style="font-size: 13px"></div>
    <button class="mt" style="width: 100%" id="btn">Sign in</button>
    <div class="muted mt center" style="font-size: 12px">Default password <code>admin123</code> — change it right after signing in</div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script src="/assets/app.js"></script>
<script>
const $ = (s) => document.querySelector(s);
async function login() {
  const pw = $('#pw').value;
  if (!pw) return;
  $('#btn').disabled = true;
  try {
    const r = await fetch('/admin/api/login', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({password: pw})
    });
    const j = await r.json();
    if (r.ok) { location.href = '/'; return; }
    $('#msg').textContent = j.error || 'Sign-in failed';
    toast(j.error || 'Sign-in failed', 'err');
  } catch (e) { toast('Network error', 'err'); }
  finally { $('#btn').disabled = false; }
}
$('#btn').onclick = login;
$('#pw').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
</script>
</body>
</html>
