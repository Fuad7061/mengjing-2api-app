services:
  mengjing-2api:
    build: .
    image: mengjing-2api:latest
    container_name: mengjing-2api
    restart: unless-stopped
    ports:
      - "8788:8788"
    environment:
      PORT: "8788"
      DATA_DIR: /data
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,os;urllib.request.urlopen('http://127.0.0.1:'+os.environ.get('PORT','8788')+'/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
